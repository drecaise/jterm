name: Docs

# Builds the MkDocs user manual on every push/PR (so --strict catches broken links),
# and deploys it to GitHub Pages on pushes to the default branch.
on:
  push:
    branches: [master]
    paths:
      - docs/**
      - mkdocs.yml
      - requirements-docs.txt
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/**
      - mkdocs.yml
      - requirements-docs.txt
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arch-diagrams:
    # Regenerate architecture diagrams from workspace.dsl and fail if the committed
    # Mermaid views are out of date.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Structurizr CLI
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/structurizr-cli.zip \
            https://github.com/structurizr/cli/releases/download/v2024.03.03/structurizr-cli.zip
          mkdir -p "$HOME/.structurizr-cli"
          unzip -q /tmp/structurizr-cli.zip -d "$HOME/.structurizr-cli"
          chmod +x "$HOME/.structurizr-cli/structurizr.sh"
          ln -sf "$HOME/.structurizr-cli/structurizr.sh" "$HOME/.local/bin/structurizr-cli" \
            || (mkdir -p "$HOME/.local/bin" && ln -sf "$HOME/.structurizr-cli/structurizr.sh" "$HOME/.local/bin/structurizr-cli")
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Regenerate and check for drift
        working-directory: docs/architecture/model
        run: make check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    # Only publish from the default branch, not from PRs.
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
