name: Security

# Unit tests on every push/PR, plus an OWASP dependency-vulnerability scan. The scan also runs
# weekly so newly-disclosed CVEs in pinned dependencies surface even without a code change.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 5 * * 1'   # Mondays 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - run: mvn -B test

  dependency-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      # Persist the NVD database across runs. The key never hits (fresh run_id), so the
      # restore-keys fallback always pulls the most recent prior DB, and a new cache is saved
      # each run. This means a transient NVD API outage falls back to yesterday's cached data
      # instead of hard-failing with "No documents exist".
      - name: Cache NVD database
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-data-${{ github.run_id }}
          restore-keys: |
            nvd-data-
      # Fails the build on a dependency with a CVE at CVSS >= 7 (see the `security` profile).
      # NVD_API_KEY (repo secret) is required to update the NVD data reliably — without a valid
      # key the NVD API rejects/throttles the update, which surfaces as a bytes-is-null NPE.
      - run: mvn -B -P security verify -DskipTests -Dnvd.api.key="${NVD_API_KEY}"
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
          if-no-files-found: ignore
