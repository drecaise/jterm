name: Security

# Unit tests on every push/PR, plus an OWASP dependency-vulnerability scan. The scan also runs
# weekly so newly-disclosed CVEs in pinned dependencies surface even without a code change.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 5 * * 1'   # Mondays 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - run: mvn -B test

  dependency-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      # Fails the build on a dependency with a CVE at CVSS >= 7 (see the `security` profile).
      # NVD_API_KEY (repo secret) avoids API throttling; the scan still runs without it, just slower.
      - run: mvn -B -P security verify -DskipTests -Dnvd.api.key="${NVD_API_KEY}"
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
          if-no-files-found: ignore
