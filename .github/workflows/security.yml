name: Security

# Unit tests on every push/PR, plus an OWASP dependency-vulnerability scan, an end-of-life
# check on the Flatpak runtime and snap base, and a check of the FreeRDP bundled with the RDP
# helper. All also run weekly so newly-disclosed CVEs in pinned dependencies, a runtime retired
# upstream, and a FreeRDP security release surface even without a code change.
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '17 5 * * 1'   # Mondays 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - run: mvn -B test

  dependency-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      # Persist the NVD database across runs. The key never hits (fresh run_id), so the
      # restore-keys fallback always pulls the most recent prior DB, and a new cache is saved
      # each run. This means a transient NVD API outage falls back to yesterday's cached data
      # instead of hard-failing with "No documents exist".
      - name: Cache NVD database
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-data-${{ github.run_id }}
          restore-keys: |
            nvd-data-
      # Fails the build on a dependency with a CVE at CVSS >= 7 (see the `security` profile).
      # NVD_API_KEY (repo secret) is required to update the NVD data reliably — without a valid
      # key the NVD API rejects/throttles the update, which surfaces as a bytes-is-null NPE.
      - run: mvn -B -P security verify -DskipTests -Dnvd.api.key="${NVD_API_KEY}"
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
          if-no-files-found: ignore

  # The Flatpak runtime and the snap base are invisible to the dependency scan above, and a
  # retired one still builds -- the warning only ever appears on a user's machine at install.
  # See .github/check-packaging-eol.sh (runs locally too).
  packaging-eol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - run: .github/check-packaging-eol.sh

  # FreeRDP is native code bundled with the RDP helper on every target: invisible to the
  # dependency scan above, and patched by no distribution -- a FreeRDP security release means a
  # jterm release. Fails on a published advisory affecting the pin, on a newer 3.x release more
  # than 14 days old, and on the Flatpak manifest drifting from native/rdp-helper/FREERDP_VERSION.
  # See .github/check-freerdp.sh (runs locally too). The token only lifts the API's anonymous
  # rate limit; everything read is public.
  freerdp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: .github/check-freerdp.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # The OpenH264 decoder jterm downloads on Linux (and builds FreeRDP's headers against). Native,
  # fed by the remote server, pinned by hash and so updated only by a jterm release -- the Maven scan
  # can't see it. Fails on a published advisory affecting the pin, on a newer release more than 14
  # days old, and on the pins (OpenH264.java, build-freerdp-linux.sh, the Flatpak manifest) drifting
  # or no longer matching Cisco's files. See .github/check-openh264.sh (runs locally too).
  openh264:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: .github/check-openh264.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
