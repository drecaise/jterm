site_name: jterm User Manual
site_description: User manual for jterm — a cross-platform Java terminal emulator with tabs, a splittable pane grid, saved SSH sessions, SFTP, tunnels and broadcast input.
site_author: Mark Moses
repo_url: https://github.com/drecaise/jterm
repo_name: drecaise/jterm
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Mark Moses — GPL-3.0-or-later

docs_dir: docs

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - exclude:
      glob:
        - "superpowers/*"
        - "superpowers/**"
        - "licensing.md"
        - "SCREENSHOTS.md"
        - "maintaining-the-docs.md"
        - "img/README.md"
        - "architecture/model/*"
        - "architecture/model/**"

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.keys
  - pymdownx.snippets:
      base_path: [docs]
      check_paths: true

extra_css:
  - assets/mermaid-zoom.css

extra_javascript:
  - assets/mermaid-zoom.js

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Tabs & panes: tabs-and-panes.md
  - Sessions sidebar: sessions-sidebar.md
  - SSH sessions: ssh-sessions.md
  - SSH auth & vault: ssh-auth-and-vault.md
  - SFTP file browser: sftp.md
  - Port forwarding (tunnels): tunnels.md
  - Broadcast input: broadcast.md
  - Macros: macros.md
  - Keyboard shortcuts: shortcuts.md
  - Settings: settings.md
  - Reconnect & save output: reconnect-and-output.md
  - Configuration files: config-files.md
  - Architecture:
    - Overview: architecture/index.md
    - System context: architecture/context.md
    - Containers: architecture/containers.md
    - Components (UI): architecture/components-ui.md
    - Components (Terminal): architecture/components-terminal.md
    - Components (Security): architecture/components-security.md
    - Runtime views: architecture/runtime-views.md
    - Deployment: architecture/deployment.md
    - Decision records:
      - Index: architecture/adr/index.md
      - 0001 Uniform R x C pane grid: architecture/adr/0001-uniform-grid-vs-split-tree.md
      - 0002 Custom JDK ssh-agent factory: architecture/adr/0002-custom-jdk-agent-factory.md
      - 0003 No dbus-java on Linux: architecture/adr/0003-exclude-java-keyring-linux-dbus.md
      - 0004 TOFU host-key verification: architecture/adr/0004-tofu-host-key-verification.md
      - 0005 Per-OS keyring CLIs: architecture/adr/0005-per-os-keyring-clis.md
      - 0006 C4 via Structurizr + Mermaid: architecture/adr/0006-c4-with-structurizr-and-mermaid.md
      - 0007 Debounced highlight scans: architecture/adr/0007-debounced-highlight-scans.md
      - 0008 Interactive auth via UserInteraction: architecture/adr/0008-interactive-auth-via-mina-userinteraction.md
  - Troubleshooting: troubleshooting.md
